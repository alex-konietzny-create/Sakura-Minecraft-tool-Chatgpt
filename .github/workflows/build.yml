name: Build Sakura Pink Fabric Client
on:
  push:
  workflow_dispatch:
jobs:
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build Fabric 1.21.11
        working-directory: Fabric
        run: gradle clean build --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SakuraLive-Pink-Fabric-1.21.11
          path: Fabric/build/libs/SakuraLive-Fabric-0.3.0.jar
          if-no-files-found: error
