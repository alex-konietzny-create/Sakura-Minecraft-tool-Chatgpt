name: Build Sakura Live
on:
  push:
  workflow_dispatch:
jobs:
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build Fabric
        working-directory: Fabric
        run: gradle clean build --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SakuraLive-Fabric-1.21.11
          path: Fabric/build/libs/*.jar
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish EXE
        run: dotnet publish Desktop/SakuraLive.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o Desktop/publish
      - uses: actions/upload-artifact@v4
        with:
          name: SakuraLive-Windows
          path: Desktop/publish/**
