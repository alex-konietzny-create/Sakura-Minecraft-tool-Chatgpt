name: Render Sakura UI
on:
  workflow_dispatch:
  push:
    paths:
      - 'Fabric/**'
      - '.github/workflows/ui-preview.yml'
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      JAVA_TOOL_OPTIONS: '-Dsakura.uiSmoke=true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Render client tabs with software OpenGL
        working-directory: Fabric
        run: xvfb-run -a -s "-screen 0 1280x800x24" timeout 300s gradle runClient -PuiSmoke --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sakura-UI-Preview
          path: |
            Fabric/run/screenshots/sakura-*.png
            Fabric/run/logs/latest.log
            Fabric/run/crash-reports/
          if-no-files-found: warn
