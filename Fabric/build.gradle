plugins { id 'fabric-loom' version '1.14-SNAPSHOT' }
group='dev.sakuralive'
version='0.6.2'
base { archivesName='SakuraLive-Fabric' }
repositories { mavenCentral(); maven { url='https://maven.fabricmc.net/' } }
dependencies {
  minecraft 'com.mojang:minecraft:1.21.11'
  mappings 'net.fabricmc:yarn:1.21.11+build.3:v2'
  modImplementation 'net.fabricmc:fabric-loader:0.19.3'
  modImplementation 'net.fabricmc.fabric-api:fabric-api:0.139.5+1.21.11'
}
processResources { inputs.property 'version',project.version; filesMatching('fabric.mod.json') { expand version:project.version } }
tasks.withType(JavaCompile).configureEach { options.release=21 }
java { sourceCompatibility=JavaVersion.VERSION_21; targetCompatibility=JavaVersion.VERSION_21 }

if (project.hasProperty('uiSmoke')) {
  loom.runs.client {
    programArgs '--width', '1280', '--height', '800'
  }
}

sourceSets {
 regression {
  java.srcDir 'src/regression/java'
  compileClasspath += sourceSets.main.output
  runtimeClasspath += sourceSets.main.output
 }
}
tasks.register('anchorRegression',JavaExec) {
 dependsOn tasks.named('regressionClasses')
 classpath=sourceSets.regression.runtimeClasspath
 mainClass='dev.sakuralive.AnchorPlanTest'
}
tasks.register('crystalRegression',JavaExec) {
 dependsOn tasks.named('regressionClasses')
 classpath=sourceSets.regression.runtimeClasspath
 mainClass='dev.sakuralive.CrystalCycleTest'
}
tasks.named('check') { dependsOn 'anchorRegression','crystalRegression' }

tasks.register('inputRegression',JavaExec) {
 dependsOn tasks.named('regressionClasses')
 classpath=sourceSets.regression.runtimeClasspath
 mainClass='dev.sakuralive.InputPulseTest'
}
tasks.named('check') { dependsOn 'inputRegression' }

tasks.register('outlineRegression',JavaExec) {
 dependsOn tasks.named('regressionClasses')
 classpath=sourceSets.regression.runtimeClasspath
 mainClass='dev.sakuralive.OutlineGeometryTest'
}
tasks.named('check') { dependsOn 'outlineRegression' }

tasks.register('cameraRegression',JavaExec) { dependsOn tasks.named('regressionClasses'); classpath=sourceSets.regression.runtimeClasspath; mainClass='dev.sakuralive.CameraMotionTest' }
tasks.named('check') { dependsOn 'cameraRegression' }

tasks.register('speedRegression',JavaExec) { dependsOn tasks.named('regressionClasses'); classpath=sourceSets.regression.runtimeClasspath; mainClass='dev.sakuralive.SpeedRegressionTest' }
tasks.named('check') { dependsOn 'speedRegression' }

tasks.register('repeatRegression',JavaExec) { dependsOn tasks.named('regressionClasses'); classpath=sourceSets.regression.runtimeClasspath; mainClass='dev.sakuralive.RepeatRegressionTest' }
tasks.named('check') { dependsOn 'repeatRegression' }

tasks.register('cleanAnchorRegression',JavaExec) { dependsOn tasks.named('regressionClasses'); classpath=sourceSets.regression.runtimeClasspath; mainClass='dev.sakuralive.CleanAnchorTest' }
tasks.named('check') { dependsOn 'cleanAnchorRegression' }
