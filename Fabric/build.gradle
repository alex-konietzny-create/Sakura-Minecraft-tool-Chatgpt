plugins { id 'fabric-loom' version '1.14-SNAPSHOT' }
group='dev.sakuralive'
version='0.1.0'
base { archivesName='SakuraLive-Fabric' }
repositories { mavenCentral(); maven { url='https://maven.fabricmc.net/' } }
dependencies {
  minecraft 'com.mojang:minecraft:1.21.11'
  mappings 'net.fabricmc:yarn:1.21.11+build.3:v2'
  modImplementation 'net.fabricmc:fabric-loader:0.19.3'
  modImplementation 'net.fabricmc.fabric-api:fabric-api:0.139.5+1.21.11'
}
processResources { inputs.property 'version',project.version; filesMatching('fabric.mod.json') { expand version:project.version } }
tasks.withType(JavaCompile).configureEach { options.release=21 }
java { sourceCompatibility=JavaVersion.VERSION_21; targetCompatibility=JavaVersion.VERSION_21 }
